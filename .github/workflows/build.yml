name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run compile

      - name: Package extension (.vsix)
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: archimate-diagrams-vsix
          path: '*.vsix'
